<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convite — Tainara & Thiago</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'], serif: ['Cormorant Garamond', 'ui-serif'] },
          colors: { stone: tailwind.colors.stone, slate: tailwind.colors.slate, rose: tailwind.colors.rose },
          boxShadow: { soft: '0 8px 30px rgba(0,0,0,.06)' }
        }
      }
    }
  </script>
  <style>
    html{scroll-behavior:smooth}
    body{background:radial-gradient(1200px 600px at 80% -10%, rgba(244,244,245,.6), transparent),
                      radial-gradient(1000px 500px at -10% 20%, rgba(253,242,248,.5), transparent),
                      #fff}
    .card{backdrop-filter: blur(8px);}
    .fade-in{opacity:0; transform:translateY(8px); animation:fade .8s ease forwards}
    .fade-in-2{opacity:0; transform:translateY(8px); animation:fade .9s .05s ease forwards}
    .fade-in-3{opacity:0; transform:translateY(8px); animation:fade 1s .1s ease forwards}
    @keyframes fade{to{opacity:1; transform:translateY(0)}}

    .icon-btn{ @apply flex flex-col items-center gap-1; }
    .icon-ring{ @apply h-12 w-12 rounded-full border border-stone-300 flex items-center justify-center bg-white; }
    .icon-label{ @apply text-[12px] text-slate-600; }
  </style>
</head>
<body class="min-h-screen text-slate-800">
  <div id="root"></div>

  <!-- React 18 (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel so we can write JSX directly in this one file -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function useNow(){
      const [now,setNow] = useState(new Date());
      useEffect(()=>{ const id=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(id) },[]);
      return now;
    }

    // ===== SVG Icons (minimal stroke) =====
    const IconReact = (props) => (
      <svg viewBox="0 0 256 256" width={props.size||22} height={props.size||22} aria-hidden="true">
        <g fill="none" stroke="currentColor" strokeWidth="12">
          <circle cx="128" cy="128" r="20"/>
          <ellipse cx="128" cy="128" rx="110" ry="44" transform="rotate(0 128 128)"/>
          <ellipse cx="128" cy="128" rx="110" ry="44" transform="rotate(60 128 128)"/>
          <ellipse cx="128" cy="128" rx="110" ry="44" transform="rotate(-60 128 128)"/>
        </g>
      </svg>
    );
    const IconPin = (props) => (
      <svg viewBox="0 0 24 24" width={props.size||22} height={props.size||22} aria-hidden="true">
        <path fill="none" stroke="currentColor" strokeWidth="1.5" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/>
        <circle cx="12" cy="10" r="2.5" fill="currentColor"/>
      </svg>
    );
    const IconPresence = (props) => (
      <svg viewBox="0 0 24 24" width={props.size||22} height={props.size||22} aria-hidden="true">
        <path fill="none" stroke="currentColor" strokeWidth="1.5" d="M4 12.5l5 5 11-11"/>
      </svg>
    );
    const IconGift = (props) => (
      <svg viewBox="0 0 24 24" width={props.size||22} height={props.size||22} aria-hidden="true">
        <path fill="none" stroke="currentColor" strokeWidth="1.5" d="M3 8h18v13H3zM3 8h18M7 8V6a3 3 0 016 0v2M17 8V6a3 3 0 00-6 0"/>
        <path fill="none" stroke="currentColor" strokeWidth="1.5" d="M12 8v13"/>
      </svg>
    );

    // Top floral illustration (delicate line flower)
    const Floral = ({size=44}) => (
      <svg viewBox="0 0 64 64" width={size} height={size} aria-hidden="true">
        <g fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
          <path d="M32 60V26"/>
          <path d="M32 26c-6 2-9-4-9-8 3 1 5 0 7-3 1 3 3 5 8 5-2 3-4 5-6 6Z"/>
          <path d="M32 38c5-1 7 4 7 7-2-1-4 0-6 2-1-2-2-4-4-5 1-2 2-3 3-4Z"/>
          <path d="M32 46c-4 0-6 3-6 6 2-1 3 0 5 2 0-2 1-4 3-5-1-1-1-2-2-3Z"/>
          <path d="M28 32c-5-1-7 4-7 7 2-1 4 0 6 2 1-2 2-4 4-5-1-2-2-3-3-4Z"/>
        </g>
      </svg>
    );

    const IconAction = ({href, label, children}) => (
      <a href={href} className="icon-btn group" target="_blank" rel="noreferrer">
        <div className="icon-ring group-hover:border-stone-400 transition">
          <span className="text-slate-700">{children}</span>
        </div>
        <span className="icon-label">{label}</span>
      </a>
    );

    function App(){
      const now = useNow();
      return (
        <main className="min-h-screen flex items-center justify-center p-4">
          <section className="w-full max-w-[560px]">
            {/* Card */}
            <div className="card fade-in rounded-3xl bg-white/70 border border-stone-200 shadow-soft p-8 text-center">
              {/* Pretty flower at the top */}
              <div className="mx-auto h-12 w-12 text-slate-700 mb-2">
                <Floral />
              </div>

              <h1 className="font-serif text-4xl tracking-[0.15em] text-slate-900">TAINARA</h1>
              <div className="font-serif text-2xl text-rose-400 my-1">&</div>
              <h2 className="font-serif text-4xl tracking-[0.15em] text-slate-900">THIAGO</h2>

              <p className="mt-6 text-sm text-slate-500 fade-in-2">Convidam para a celebração do casamento</p>
              <p className="mt-2 text-base text-slate-700 fade-in-2"><strong>xx.11.2026 | 16h30</strong></p>
              <p className="mt-2 text-sm text-slate-600 fade-in-2">Espaço Jardim das Flores<br/>Av. Exemplo, 123 — São Paulo, SP</p>

              <div className="my-6 mx-auto h-px w-24 bg-stone-300/70"></div>

              {/* Icon row */}
              <div className="grid grid-cols-4 gap-4 fade-in-3 place-items-center">
                <IconAction href="https://thiagovscode.github.io/convite/" label="Site">
                  <IconReact />
                </IconAction>
                <IconAction href="https://maps.app.goo.gl/Lg3BKSGiwFDxXBMJ9" label="Local">
                  <IconPin />
                </IconAction>
                <IconAction href="https://wa.me/" label="Presença">
                  <IconPresence />
                </IconAction>
                <IconAction href="https://thiagovscode.github.io/convite/#presentes" label="presentes">
                  <IconGift />
                </IconAction>
              </div>

              <p className="text-[11px] text-slate-400 mt-6">Toque para acessar</p>
            </div>

            {/* Rodapé minimal */}
            <div className="text-center mt-6 text-xs text-slate-500 fade-in-3">
              <span>{now.toLocaleDateString('pt-BR')} • {now.toLocaleTimeString('pt-BR')}</span>
            </div>
          </section>
        </main>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
